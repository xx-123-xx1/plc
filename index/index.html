<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLC 段码屏模拟器 (共阴极)</title>
<style>
  body {
    background-color: #1a1a1a;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  h1 {
    color: #00ffcc;
    margin-bottom: 5px;
    font-size: 24px;
  }

  .subtitle {
    color: #888;
    margin-bottom: 30px;
    font-size: 14px;
  }

  /* 数码管外壳 */
  .segment-display {
    position: relative;
    width: 200px;
    height: 300px;
    background-color: #111;
    border-radius: 15px;
    padding: 20px;
    box-shadow: inset 0 0 20px #000, 0 0 15px rgba(0, 255, 204, 0.1);
    border: 2px solid #333;
    margin-bottom: 40px;
  }

  /* 数码管背景网格，增加真实感 */
  .segment-display::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 20px 20px;
    border-radius: 15px;
    pointer-events: none;
  }

  /* 段的通用样式 */
  .seg {
    position: absolute;
    background-color: #222;
    transition: background-color 0.1s, box-shadow 0.1s;
    /* 未点亮时的微弱轮廓 */
    border: 1px solid #1a1a1a; 
  }

  /* 点亮状态：共阴极，高电平亮（红色） */
  .seg.on {
    background-color: #ff2a2a;
    box-shadow: 0 0 20px #ff2a2a, 0 0 40px rgba(255, 42, 42, 0.5);
    border: 1px solid #ff5555;
  }

  /* 定义水平段 (a, g, d) 的形状 - 两端带斜角 */
  .seg-h {
    height: 18px;
    width: 90px;
    clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
    left: 55px;
  }

  /* 定义垂直段 (b, c, e, f) 的形状 - 两端带斜角 */
  .seg-v {
    width: 18px;
    height: 90px;
    clip-path: polygon(0% 10%, 50% 0%, 100% 10%, 100% 90%, 50% 100%, 0% 90%);
  }

  /* 各段位置定位 */
  #seg-a { top: 25px; left: 55px; }
  #seg-b { top: 45px; right: 20px; } /* 右上 */
  #seg-c { bottom: 45px; right: 20px; } /* 右下 */
  #seg-d { bottom: 25px; left: 55px; }
  #seg-e { bottom: 45px; left: 20px; } /* 左下 */
  #seg-f { top: 45px; left: 20px; } /* 左上 */
  #seg-g { top: 145px; left: 55px; }

  /* 控制面板 */
  .control-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    width: 100%;
    max-width: 320px;
  }

  .input-group {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  input[type="number"] {
    flex: 1;
    padding: 12px 15px;
    font-size: 18px;
    border-radius: 8px;
    border: 2px solid #444;
    background-color: #222;
    color: #fff;
    outline: none;
    text-align: center;
    transition: border-color 0.3s;
  }

  input[type="number"]:focus {
    border-color: #00ffcc;
  }

  button {
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background-color: #00ffcc;
    color: #111;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
  }

  button:hover {
    background-color: #00ccaa;
  }

  button:active {
    transform: scale(0.95);
  }

  /* 数字快捷键盘 */
  .keypad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    width: 100%;
  }

  .keypad button {
    padding: 12px 0;
    font-size: 18px;
    background-color: #333;
    color: #ddd;
    border: 1px solid #444;
  }

  .keypad button:hover {
    background-color: #444;
    color: #00ffcc;
  }

  .keypad button.clear {
    grid-column: span 5;
    background-color: #661111;
    color: #ff9999;
  }

  .keypad button.clear:hover {
    background-color: #882222;
  }

  .status {
    margin-top: 10px;
    font-size: 14px;
    color: #888;
    height: 20px;
  }
</style>
</head>
<body>

  <h1>共阴极七段数码管模拟器</h1>
  <div class="subtitle">输入 0-9，对应的段会点亮（高电平）</div>

  <!-- 数码管结构 -->
  <div class="segment-display">
    <div class="seg seg-h" id="seg-a"></div>
    <div class="seg seg-v" id="seg-b"></div>
    <div class="seg seg-v" id="seg-c"></div>
    <div class="seg seg-h" id="seg-d"></div>
    <div class="seg seg-v" id="seg-e"></div>
    <div class="seg seg-v" id="seg-f"></div>
    <div class="seg seg-h" id="seg-g"></div>
  </div>

  <div class="control-panel">
    <div class="input-group">
      <input type="number" id="numInput" min="0" max="9" placeholder="输入 0-9" value="0">
      <button onclick="updateDisplay()">显示</button>
    </div>

    <div class="keypad">
      <button onclick="setNumber(0)">0</button>
      <button onclick="setNumber(1)">1</button>
      <button onclick="setNumber(2)">2</button>
      <button onclick="setNumber(3)">3</button>
      <button onclick="setNumber(4)">4</button>
      <button onclick="setNumber(5)">5</button>
      <button onclick="setNumber(6)">6</button>
      <button onclick="setNumber(7)">7</button>
      <button onclick="setNumber(8)">8</button>
      <button onclick="setNumber(9)">9</button>
      <button class="clear" onclick="clearDisplay()">熄灭 / 清零</button>
    </div>

    <div class="status" id="status">当前显示：0</div>
  </div>

<script>
  // 获取所有段元素
  const segments = {
    a: document.getElementById('seg-a'),
    b: document.getElementById('seg-b'),
    c: document.getElementById('seg-c'),
    d: document.getElementById('seg-d'),
    e: document.getElementById('seg-e'),
    f: document.getElementById('seg-f'),
    g: document.getElementById('seg-g')
  };

  // 共阴极码表（与 PLC 中的十六进制码一一对应）
  // 0x3F -> a,b,c,d,e,f
  // 0x06 -> b,c
  // 0x5B -> a,b,d,e,g
  // 0x4F -> a,b,c,d,g
  // 0x66 -> b,c,f,g
  // 0x6D -> a,c,d,f,g
  // 0x7D -> a,c,d,e,f,g
  // 0x07 -> a,b,c
  // 0x7F -> a,b,c,d,e,f,g
  // 0x6F -> a,b,c,d,f,g
  const digitMap = {
    0: ['a', 'b', 'c', 'd', 'e', 'f'],
    1: ['b', 'c'],
    2: ['a', 'b', 'g', 'e', 'd'],
    3: ['a', 'b', 'g', 'c', 'd'],
    4: ['f', 'g', 'b', 'c'],
    5: ['a', 'f', 'g', 'c', 'd'],
    6: ['a', 'f', 'g', 'e', 'd', 'c'],
    7: ['a', 'b', 'c'],
    8: ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
    9: ['a', 'b', 'c', 'd', 'f', 'g']
  };

  // 更新显示函数
  function updateDisplay() {
    const input = document.getElementById('numInput');
    const val = parseInt(input.value);
    const status = document.getElementById('status');

    // 先熄灭所有段
    for (let key in segments) {
      segments[key].classList.remove('on');
    }

    // 如果输入是 0-9，则点亮对应的段
    if (val >= 0 && val <= 9) {
      const activeSegments = digitMap[val];
      activeSegments.forEach(seg => {
        segments[seg].classList.add('on');
      });
      status.innerText = `当前显示：${val}`;
      status.style.color = '#00ffcc';
    } else {
      // 输入其他数字，全部熄灭
      status.innerText = `输入无效，数码管熄灭`;
      status.style.color = '#ff5555';
    }
  }

  // 快捷键盘设置数字
  function setNumber(num) {
    document.getElementById('numInput').value = num;
    updateDisplay();
  }

  // 清空/熄灭
  function clearDisplay() {
    document.getElementById('numInput').value = '';
    for (let key in segments) {
      segments[key].classList.remove('on');
    }
    document.getElementById('status').innerText = '数码管已熄灭';
    document.getElementById('status').style.color = '#888';
  }

  // 监听输入框回车事件
  document.getElementById('numInput').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      updateDisplay();
    }
  });

  // 页面加载时默认显示 0
  window.onload = updateDisplay;
</script>

</body>
</html>
